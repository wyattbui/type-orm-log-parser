<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TypeORM JSON Log Parser</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #f5f7fb; --ink: #0f172a; --border: #e5e7eb;
      --btn: #111827; --btn-hover: #1f2937; --btn-ink: #fff;
      --card: #1f2937; --card-ink: #e5e7eb;
      --kw: #66d9ef; --str: #e6db74; --num: #ae81ff; --entity: #93c5fd;
    }
    * { box-sizing: border-box }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .container { max-width: 1400px; margin: 28px auto; padding: 0 16px; }
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    h1 { margin: 0; font-size: 18px; }
    .logo { display: inline-flex; width: 36px; height: 36px; align-items: center; justify-content: center; border-radius: 10px; background: #fff; border: 1px solid var(--border); font-size: 18px; }
    textarea { width: 100%; min-height: 200px; resize: vertical; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: #fff; color: #111827; outline: none; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    textarea:focus { box-shadow: 0 0 0 3px rgba(59,130,246,.15) }
    .output { margin-top: 14px; }
    .query-block { position: relative; background: var(--card); color: var(--card-ink); border-radius: 14px; padding: 16px 14px 14px; margin: 12px 0; box-shadow: 0 6px 24px rgba(0,0,0,.08); border: 1px solid rgba(255,255,255,.06); }
    .copy-btn { position: absolute; top: 10px; right: 10px; padding: 7px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,.08); background: #374151; color: #e5e7eb; font-weight: 700; cursor: pointer; font-size: 13px; }
    .copy-btn:hover { background: #2b3441 }
    .meta { color: #9ca3af; font-size: 12px; margin-bottom: 8px; }
    pre { margin: 0; white-space: pre-wrap; word-wrap: break-word; }
    .keyword { color: var(--kw); font-weight: 700 }
    .string { color: var(--str) }
    .number { color: var(--num) }
    .entity { color: var(--entity); font-weight: 600 }
    .ident { color: #cbd5e1; font-weight: 600 }
    .undef { color: #fca5a5; font-weight: 700 }
    .empty { color: #6b7280; text-align: center; padding: 32px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="logo">🛠️</span>
      <h1>TypeORM JSON Log Parser</h1>
    </div>
    <textarea id="input" placeholder='Paste JSON log lines here (context:"TypeORM" format)...' spellcheck="false"></textarea>
    <div id="output" class="output"></div>
  </div>

  <script>
    const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function highlightSQL(sql) {
      let work = sql;
      const dq = [];
      work = work.replace(/"([^"]*)"/g, (m, id) => { const i = dq.length; dq.push(id); return `__DQ${i}__`; });
      const sq = [];
      work = work.replace(/'(?:''|[^'])*'/g, m => { const i = sq.length; sq.push(m); return `__SQ${i}__`; });

      let t = esc(work);
      t = t.replace(/\b(SELECT|FROM|WHERE|AND|OR|JOIN|LEFT|RIGHT|INNER|FULL|CROSS|ON|IN|AS|IS|TRUE|FALSE|NOT|NULL|UPDATE|SET|INSERT|INTO|VALUES|DELETE|RETURNING|GROUP\s+BY|HAVING|ORDER\s+BY|LIMIT|OFFSET|BETWEEN|DISTINCT|COUNT|EXISTS|CASE|WHEN|THEN|ELSE|END)\b/gi,
        m => `<span class="keyword">${m}</span>`);
      t = t.replace(/\b\d+(\.\d+)?\b/g, m => `<span class="number">${m}</span>`);
      t = t.replace(/\bundefined\b/gi, m => `<span class="undef">${m}</span>`);

      dq.forEach((id, i) => {
        const isEntity = /entity/i.test(id) || /__/.test(id);
        t = t.replace(`__DQ${i}__`, `<span class="${isEntity ? 'entity' : 'ident'}">${esc('"' + id + '"')}</span>`);
      });
      sq.forEach((s, i) => { t = t.replace(`__SQ${i}__`, `<span class="string">${esc(s)}</span>`); });
      return t;
    }

    function beautifySQL(sql) {
      return sql
        .replace(/\bSELECT\b/gi, 'SELECT\n  ')
        .replace(/,\s*/g, ',\n  ')
        .replace(/\bFROM\b/gi, '\nFROM\n  ')
        .replace(/\b(LEFT|RIGHT|INNER|FULL|CROSS)?\s*JOIN\b/gi, m => `\n${m.trim()}\n  `)
        .replace(/\bON\b/gi, '\n  ON ')
        .replace(/\bWHERE\b/gi, '\nWHERE\n  ')
        .replace(/\bAND\b/gi, '\n  AND ')
        .replace(/\bOR\b/gi, '\n  OR ')
        .replace(/\bORDER BY\b/gi, '\nORDER BY\n  ')
        .replace(/\bGROUP BY\b/gi, '\nGROUP BY\n  ')
        .replace(/\bHAVING\b/gi, '\nHAVING\n  ')
        .replace(/\bLIMIT\b/gi, '\nLIMIT ')
        .replace(/\bOFFSET\b/gi, '\nOFFSET ')
        .replace(/\bVALUES\b/gi, '\nVALUES\n  ')
        .replace(/\bRETURNING\b/gi, '\nRETURNING\n  ')
        .replace(/\bSET\b/gi, '\nSET\n  ')
        .replace(/\n\s*\n/g, '\n')
        .trim();
    }

    function injectParams(query, params) {
      if (!params || !params.length) return query;
      if (/\$\d+/.test(query)) {
        return query.replace(/\$(\d+)/g, (_, n) => {
          const v = params[Number(n) - 1];
          return typeof v === 'string' ? `'${v.replace(/'/g, "''")}'` : String(v ?? 'NULL');
        });
      }
      let i = 0;
      return query.replace(/\?/g, () => {
        const v = params[i++];
        return typeof v === 'string' ? `'${v.replace(/'/g, "''")}'` : String(v ?? 'NULL');
      });
    }

    function parseLog() {
      const raw = document.getElementById('input').value;
      const results = [];

      for (const line of raw.split('\n')) {
        const trimmed = line.trim();
        if (!trimmed) continue;

        const jsonStr = trimmed.replace(/^[^{]*/, '');
        if (!jsonStr.startsWith('{')) continue;

        let entry;
        try { entry = JSON.parse(jsonStr); } catch { continue; }

        if (entry.context !== 'TypeORM' || !entry.query) continue;
        const q = entry.query.trim();
        if (!q || /^(SELECT 1|START TRANSACTION|COMMIT|ROLLBACK)$/i.test(q)) continue;
        if (!/\b(SELECT|INSERT|UPDATE|DELETE|WITH)\b/i.test(q)) continue;

        const interpolated = injectParams(q, entry.parameters || []);
        const formatted = beautifySQL(interpolated);
        results.push({ formatted, time: entry.time });
      }

      render(results);
      window._lastParsed = results.map(r => r.formatted);
    }

    function render(results) {
      const out = document.getElementById('output');
      out.innerHTML = '';
      if (!results.length) {
        out.innerHTML = '<div class="empty">No TypeORM queries found.</div>';
        return;
      }
      results.forEach((r, idx) => {
        const block = document.createElement('div');
        block.className = 'query-block';

        const meta = document.createElement('div');
        meta.className = 'meta';
        const ts = r.time ? new Date(r.time).toISOString() : '';
        meta.textContent = `#${idx + 1}${ts ? ' • ' + ts : ''}`;
        block.appendChild(meta);

        const btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.textContent = '📋 Copy';
        btn.onclick = () => copyText(r.formatted);
        block.appendChild(btn);

        const pre = document.createElement('pre');
        pre.innerHTML = highlightSQL(r.formatted);
        block.appendChild(pre);

        out.appendChild(block);
      });
    }

    async function copyText(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(text);
        else { const el = Object.assign(document.createElement('textarea'), {value: text}); document.body.appendChild(el); el.select(); document.execCommand('copy'); el.remove(); }
        alert('✅ Copied!');
      } catch (e) { alert('⚠️ Copy failed: ' + e.message); }
    }

    document.getElementById('input').addEventListener('input', parseLog);
  </script>
</body>
</html>
