<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Log Flow Analyzer</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <style>
    :root {
      --bg:#f0f2f5; --card:#fff; --border:#e5e7eb; --ink:#111827; --muted:#6b7280;
      --l-error:#fef2f2; --b-error:#fca5a5; --t-error:#dc2626;
      --l-warn:#fffbeb;  --b-warn:#fcd34d;  --t-warn:#d97706;
      --l-info:#f0fdf4;  --b-info:#86efac;  --t-info:#16a34a;
      --l-debug:#f8fafc; --b-debug:#cbd5e1; --t-debug:#475569;
      --flow-border:#6366f1;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--ink);font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .layout{display:flex;height:100vh;overflow:hidden}
    .sidebar{width:260px;min-width:200px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
    .sidebar-header{padding:12px 14px;border-bottom:1px solid var(--border);font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
    .sidebar-body{flex:1;overflow-y:auto;padding:10px}
    .service-list{display:flex;flex-direction:column;gap:4px}
    .svc-item{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;cursor:pointer;user-select:none;border:1px solid transparent}
    .svc-item:hover{background:#f3f4f6}
    .svc-item input{cursor:pointer;accent-color:var(--flow-border)}
    .svc-badge{font-size:11px;padding:1px 6px;border-radius:999px;background:#e0e7ff;color:#4338ca;font-weight:600;margin-left:auto}
    .svc-item.is-infra .svc-badge{background:#fee2e2;color:#dc2626}
    .sidebar-actions{padding:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
    .btn{padding:7px 12px;border-radius:8px;border:none;cursor:pointer;font:inherit;font-weight:600;font-size:12px}
    .btn-primary{background:#4f46e5;color:#fff}
    .btn-primary:hover{background:#4338ca}
    .btn-secondary{background:#f3f4f6;color:#374151;border:1px solid var(--border)}
    .btn-secondary:hover{background:#e5e7eb}
    .btn-danger{background:#fee2e2;color:#dc2626;border:1px solid #fca5a5}
    .btn-danger:hover{background:#fecaca}
    .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
    .topbar{padding:10px 16px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .topbar h1{font-size:15px;font-weight:700}
    .stats{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
    .stat{font-size:11px;padding:3px 8px;border-radius:999px;font-weight:600}
    .stat-error{background:var(--l-error);color:var(--t-error);border:1px solid var(--b-error)}
    .stat-warn{background:var(--l-warn);color:var(--t-warn);border:1px solid var(--b-warn)}
    .stat-flow{background:#ede9fe;color:#6d28d9;border:1px solid #c4b5fd}
    .input-area{padding:10px 16px;background:#f8fafc;border-bottom:1px solid var(--border)}
    textarea{width:100%;height:120px;resize:vertical;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:#fff;font:inherit;outline:none}
    textarea:focus{box-shadow:0 0 0 3px rgba(99,102,241,.15)}
    .content{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
    .flow-block{border:1px solid #bfdbfe;border-radius:10px;background:#eff6ff}
    .flow-block.has-error{border-color:var(--b-error);background:#fff8f8}
    .flow-block.has-warn{border-color:var(--b-warn);background:#fffdf0}
    .flow-block.is-anon{border-color:#d1d5db;background:#f9fafb}
    .flow-block.is-worker{border-color:#d6b896;background:#fdf6ee}
    .flow-block.has-error .flow-header{background:#fef2f2}
    .flow-block.has-warn .flow-header{background:#fffbeb}
    .flow-block.is-anon .flow-header{background:#f3f4f6}
    .flow-block.is-worker .flow-header{background:#f5e6d3}
    .flow-block .flow-header{background:#dbeafe}
    .flow-header{padding:8px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;background:#fafafa;border-bottom:1px solid var(--border)}
    .flow-header:hover{background:#f3f4f6}
    .flow-title{font-weight:700;font-size:13px;flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:2px;line-height:1.2}
    .flow-trace{font-size:11px;color:#6b7280;font-weight:400;word-break:break-all}
    .flow-meta{font-size:11px;color:var(--muted)}
    .flow-badges{display:flex;gap:4px}
    .badge{font-size:10px;padding:2px 6px;border-radius:999px;font-weight:700}
    .badge-error{background:var(--l-error);color:var(--t-error);border:1px solid var(--b-error)}
    .badge-warn{background:var(--l-warn);color:var(--t-warn);border:1px solid var(--b-warn)}
    .badge-svc{background:#ede9fe;color:#6d28d9;border:1px solid #c4b5fd}
    .flow-body{display:none}
    .flow-body.open{display:block;height:400px;max-height:1000px;min-height:80px;overflow-y:scroll;border-top:1px solid var(--border);border-radius:0 0 10px 10px;resize:vertical;animation:slideDown .2s ease}
    @keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
    .log-row{display:flex;gap:8px;padding:5px 12px;border-bottom:1px solid #f3f4f6;align-items:flex-start;flex-wrap:wrap}
    .log-row:last-child{border-bottom:none}
    .log-row.level-error{background:var(--l-error)}
    .log-row.level-warn{background:var(--l-warn)}
    .log-row.level-debug{background:var(--l-debug)}
    .log-time{color:var(--muted);font-size:11px;white-space:nowrap;min-width:80px}
    .log-level{font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;white-space:nowrap;min-width:36px;text-align:center}
    .ll-error{background:var(--l-error);color:var(--t-error)}
    .ll-warn{background:var(--l-warn);color:var(--t-warn)}
    .ll-info{background:var(--l-info);color:var(--t-info)}
    .ll-debug{background:var(--l-debug);color:var(--t-debug)}
    .log-svc{font-size:11px;color:#6d28d9;font-weight:600;white-space:nowrap;min-width:100px;overflow:hidden;text-overflow:ellipsis}
    .log-ctx{font-size:11px;color:#0369a1;white-space:nowrap;min-width:120px;overflow:hidden;text-overflow:ellipsis}
    .log-src{font-size:11px;color:#6b7280;white-space:nowrap;min-width:140px;overflow:hidden;text-overflow:ellipsis}
    .log-msg{flex:1;word-break:break-word;font-size:12px}
    .sql-block{margin-top:6px;width:100%;background:#1f2937;color:#e5e7eb;border-radius:8px;padding:10px 12px;position:relative;font-size:12px}
    .sql-block pre{white-space:pre-wrap;word-wrap:break-word;margin:0}
    .sql-copy{position:absolute;top:6px;right:6px;padding:3px 8px;border-radius:5px;border:1px solid rgba(255,255,255,.1);background:#374151;color:#e5e7eb;cursor:pointer;font-size:11px;font-weight:700}
    .sql-copy:hover{background:#2b3441}
    .kw{color:#66d9ef;font-weight:700}.str{color:#e6db74}.num{color:#ae81ff}.ent{color:#93c5fd;font-weight:600}.idn{color:#cbd5e1;font-weight:600}
    .ungrouped-block{border:1px solid var(--border);border-radius:10px;background:var(--card)}
    .ungrouped-header{padding:8px 12px;background:#fafafa;border-bottom:1px solid var(--border);font-weight:700;font-size:12px;color:var(--muted);cursor:pointer;user-select:none}
    .empty{text-align:center;padding:40px;color:var(--muted)}
    .chevron{transition:transform .2s;display:inline-block;margin-right:4px}
    .chevron.open{transform:rotate(90deg)}
    .filter-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
    .filter-btn{padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;font:inherit;font-size:11px;font-weight:600}
    .filter-btn.active{background:#4f46e5;color:#fff;border-color:#4f46e5}
  </style>
</head>
<body>
<div class="layout">
  <div class="sidebar">
    <div class="sidebar-header">🔍 Services</div>
    <div class="sidebar-body">
      <div id="serviceList" class="service-list"><div style="color:var(--muted);font-size:12px">Paste log to detect services</div></div>
      <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border)">
        <div style="font-weight:700;font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between">
          📃 Flow Names
          <span style="display:flex;gap:4px">
            <button class="btn btn-secondary" style="padding:2px 7px;font-size:10px" onclick="toggleAllCtx(true)">All</button>
            <button class="btn btn-secondary" style="padding:2px 7px;font-size:10px" onclick="toggleAllCtx(false)">None</button>
          </span>
        </div>
        <div id="contextList" class="service-list" style="max-height:200px;overflow-y:auto"></div>
      </div>
      <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border)">
        <div style="font-weight:700;font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between">
          🏷 Log Contexts
          <span style="display:flex;gap:4px">
            <button class="btn btn-secondary" style="padding:2px 7px;font-size:10px" onclick="toggleAllLogCtx(true)">All</button>
            <button class="btn btn-secondary" style="padding:2px 7px;font-size:10px" onclick="toggleAllLogCtx(false)">None</button>
          </span>
        </div>
        <div id="logContextList" class="service-list" style="max-height:200px;overflow-y:auto"></div>
      </div>
    </div>
    <div class="sidebar-actions">
      <button class="btn btn-primary" onclick="onlyServices()">✅ Only service-*</button>
      <button class="btn btn-secondary" onclick="toggleAll(true)">☑ Select All</button>
      <button class="btn btn-secondary" onclick="toggleAll(false)">☐ Deselect All</button>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <span>🛠️</span>
      <h1>Log Flow Analyzer</h1>
      <div class="filter-bar">
        <button class="filter-btn active" id="fAll" onclick="setLevelFilter('all')">All</button>
        <button class="filter-btn" id="fError" onclick="setLevelFilter('error')">🔴 Errors only</button>
        <button class="filter-btn" id="fWarn" onclick="setLevelFilter('warn')">🟡 Warn+</button>
        <button class="filter-btn" id="btnCollapseAll" onclick="collapseAll()">⊟ Collapse All</button>
      </div>
      <div id="timeRangeWrap" style="display:none;align-items:center;gap:8px;font-size:11px;flex:1;min-width:320px">
        <span style="color:var(--muted);white-space:nowrap">🕐</span>
        <div id="dualSlider" style="position:relative;flex:1;height:20px;display:flex;align-items:center;cursor:pointer">
          <div style="position:absolute;left:0;right:0;height:4px;background:#e5e7eb;border-radius:2px"></div>
          <div id="sliderTrack" style="position:absolute;height:4px;background:#4f46e5;border-radius:2px"></div>
          <div id="thumbFrom" style="position:absolute;width:16px;height:16px;background:#4f46e5;border-radius:50%;transform:translateX(-50%);cursor:grab;z-index:4;box-shadow:0 1px 4px rgba(0,0,0,.3)"></div>
          <div id="thumbTo"   style="position:absolute;width:16px;height:16px;background:#4f46e5;border-radius:50%;transform:translateX(-50%);cursor:grab;z-index:4;box-shadow:0 1px 4px rgba(0,0,0,.3)"></div>
        </div>
        <span id="timeRangeLabel" style="color:#374151;white-space:nowrap;font-size:11px"></span>
        <button class="filter-btn" onclick="resetSlider()">✕</button>
      </div>
      <div class="stats" id="stats"></div>
    </div>
    <div class="input-area">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <label style="display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:12px;font-weight:600;color:#374151" id="fileLabel">
          📂 Import file
          <input type="file" id="fileInput" accept=".log,.txt" multiple style="display:none" onchange="onFileImport(this)">
        </label>
        <span id="fileName" style="font-size:11px;color:var(--muted)"></span>
        <button id="clearFileBtn" style="display:none" class="filter-btn" onclick="clearFile()">✕ Clear file</button>
      </div>
      <textarea id="input" placeholder="Paste docker-compose logs here..." spellcheck="false"></textarea>
    </div>
    <div class="content" id="output"><div class="empty">Paste log above to start analyzing</div></div>
  </div>
</div>

<script>
  const INFRA = ['kong', 'mongodb', 'watchtower', 'redis', 'postgres', 'mysql', 'nginx', 'rabbitmq', 'kafka', 'zookeeper'];
  const LEVEL_MAP = {10:'debug',20:'info',30:'info',40:'warn',50:'error',60:'error'};

  let allEntries = [];
  let serviceChecks = {};
  let contextChecks = {};
  let logContextChecks = {};
  let levelFilter = 'all';

  let lastContent = "";

  function parseLevel(n) { return LEVEL_MAP[n] || (n >= 50 ? 'error' : n >= 40 ? 'warn' : n >= 30 ? 'info' : 'debug'); }

  function escHtml(s) { return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function highlightSQL(sql) {
    let work = sql;
    const dq = [];
    work = work.replace(/"([^"]*)"/g, (m,id) => { const i=dq.length; dq.push(id); return `__DQ${i}__`; });
    const sq = [];
    work = work.replace(/'(?:''|[^'])*'/g, m => { const i=sq.length; sq.push(m); return `__SQ${i}__`; });
    let t = escHtml(work);
    t = t.replace(/\b(SELECT|FROM|WHERE|AND|OR|JOIN|LEFT|RIGHT|INNER|FULL|CROSS|ON|IN|AS|IS|TRUE|FALSE|NOT|NULL|UPDATE|SET|INSERT|INTO|VALUES|DELETE|RETURNING|GROUP\s+BY|HAVING|ORDER\s+BY|LIMIT|OFFSET|BETWEEN|DISTINCT|COUNT|EXISTS|CASE|WHEN|THEN|ELSE|END)\b/gi, m=>`<span class="kw">${m}</span>`);
    t = t.replace(/\b\d+(\.\d+)?\b/g, m=>`<span class="num">${m}</span>`);
    dq.forEach((id,i) => { t = t.replace(`__DQ${i}__`, `<span class="${/entity/i.test(id)||/__/.test(id)?'ent':'idn'}">${escHtml('"'+id+'"')}</span>`); });
    sq.forEach((s,i) => { t = t.replace(`__SQ${i}__`, `<span class="str">${escHtml(s)}</span>`); });
    return t;
  }

  function beautifySQL(sql) {
    return sql
      .replace(/\bSELECT\b/gi,'SELECT\n  ').replace(/,\s*/g,',\n  ')
      .replace(/\bFROM\b/gi,'\nFROM\n  ')
      .replace(/\b(LEFT|RIGHT|INNER|FULL|CROSS)?\s*JOIN\b/gi, m=>`\n${m.trim()}\n  `)
      .replace(/\bWHERE\b/gi,'\nWHERE\n  ').replace(/\bAND\b/gi,'\n  AND ').replace(/\bOR\b/gi,'\n  OR ')
      .replace(/\bORDER\s+BY\b/gi,'\nORDER BY\n  ').replace(/\bGROUP\s+BY\b/gi,'\nGROUP BY\n  ')
      .replace(/\bLIMIT\b/gi,'\nLIMIT ').replace(/\bOFFSET\b/gi,'\nOFFSET ')
      .replace(/\bSET\b/gi,'\nSET\n  ').replace(/\bVALUES\b/gi,'\nVALUES\n  ')
      .replace(/\bRETURNING\b/gi,'\nRETURNING\n  ')
      .replace(/\n\s*\n/g,'\n').trim();
  }

  function injectParams(query, params) {
    if (!params || !params.length) return query;
    if (/\$\d+/.test(query)) return query.replace(/\$(\d+)/g, (_,n) => { const v=params[Number(n)-1]; return typeof v==='string'?`'${v.replace(/'/g,"''")}'`:String(v??'NULL'); });
    let i=0; return query.replace(/\?/g, () => { const v=params[i++]; return typeof v==='string'?`'${v.replace(/'/g,"''")}'`:String(v??'NULL'); });
  }

  const SKIP_CTX = new Set(['ElasticAPMService','ElasticAPMInterceptor']);

  function normalizeTraceValue(v) {
    return typeof v === 'string' ? v.trim() : '';
  }

  function extractTraceMeta(obj) {
    const headers = obj?.req?.headers || {};
    const rawRequestId = normalizeTraceValue(obj?.requestId || headers['x-request-id'] || obj?.req?.id);
    const rawCorrelationId = normalizeTraceValue(obj?.correlationId || headers['x-correlation-id']);
    const requestId = rawRequestId || rawCorrelationId;
    const correlationId = rawCorrelationId || rawRequestId;
    return { requestId, correlationId };
  }

  function getTraceId(e) {
    return normalizeTraceValue(
      e.correlationId ||
      e.requestId ||
      e.obj?.correlationId ||
      e.obj?.requestId ||
      e.obj?.req?.headers?.['x-correlation-id'] ||
      e.obj?.req?.headers?.['x-request-id'] ||
      e.obj?.req?.id ||
      ''
    );
  }

  function parseEntries(raw) {
    const entries = [];
    const seen = new Set();
    let currentSourceFile = '';
    for (const line of raw.split('\n')) {
      const t = line.trim();
      if (!t) continue;
      if (t.startsWith('@@SOURCE_FILE@@ ')) {
        currentSourceFile = t.slice('@@SOURCE_FILE@@ '.length).trim();
        continue;
      }
      const seenKey = `${currentSourceFile}::${t}`;
      if (seen.has(seenKey)) continue;
      seen.add(seenKey);
      const m = t.match(/^(\S+)\s*\|\s*(\{.+)/);
      let service = '', jsonStr = '';
      if (m) { service = m[1]; jsonStr = m[2]; }
      else if (t.startsWith('{')) { service = '_unknown'; jsonStr = t; }
      else {
        const pinoLine =
          t.match(/^\[([\d:.]+)\]\s+(\w+)\s+\((\d*)\):\s+([\s\S]+)/) ||
          t.match(/^\[([\d:.]+)\]\s+(\w+):\s+([\s\S]+)/);
        if (pinoLine) {
          let lvlRaw = '', rest = '';
          if (pinoLine.length === 5) {
            lvlRaw = pinoLine[2].toLowerCase();
            rest = pinoLine[4].trim();
          } else {
            lvlRaw = pinoLine[2].toLowerCase();
            rest = pinoLine[3].trim();
          }



          const lvl = lvlRaw === 'error' ? 'error' : lvlRaw === 'warn' ? 'warn' : lvlRaw === 'info' ? 'info' : 'debug';
          const jsonIdx = rest.lastIndexOf(' {');
          let msg = rest, obj = null, ctx = '';
          if (jsonIdx !== -1) {
            try {
              obj = JSON.parse(rest.slice(jsonIdx + 1));
              msg = rest.slice(0, jsonIdx).trim();
              ctx = obj.context || '';
            } catch { obj = null; }
          }
          if (obj && SKIP_CTX.has(ctx)) continue;
          const traceMeta = extractTraceMeta(obj);
          if (obj?.query) {
            entries.push({ service: '_unknown', level: lvl, msg, time: null, context: ctx, sourceFile: currentSourceFile, requestId: traceMeta.requestId, correlationId: traceMeta.correlationId, raw: t, isJson: true, obj });
          } else {
            entries.push({ service: '_unknown', level: lvl, msg: obj ? msg : rest, time: null, context: ctx, sourceFile: currentSourceFile, requestId: traceMeta.requestId, correlationId: traceMeta.correlationId, raw: t, isJson: !!obj, obj: obj || undefined });
          }
          continue;
        }
        const plain = t.match(/^(\S+)\s*\|\s*(.+)/);
        if (plain) entries.push({ service: plain[1], level: 'info', msg: plain[2], time: null, context: '', sourceFile: currentSourceFile, raw: t, isJson: false });
        continue;
      }
      let obj;
      try { obj = JSON.parse(jsonStr); } catch { entries.push({ service, level: 'info', msg: jsonStr.slice(0,120), time: null, context: '', sourceFile: currentSourceFile, raw: t, isJson: false }); continue; }
      if (SKIP_CTX.has(obj.context)) continue;
      const level = parseLevel(obj.level);
      const ts = obj.time ? new Date(obj.time) : null;
      const traceMeta = extractTraceMeta(obj);
      entries.push({ service, level, msg: obj.msg || obj.message || '', time: ts, context: obj.context || '', hostname: obj.hostname || '', sourceFile: currentSourceFile, requestId: traceMeta.requestId, correlationId: traceMeta.correlationId, raw: t, isJson: true, obj });
    }
    return entries;
  }

  function detectServices(entries) {
    const map = {};
    for (const e of entries) {
      if (!map[e.service]) map[e.service] = 0;
      map[e.service]++;
    }
    return map;
  }

  function isInfra(svc) { return INFRA.some(i => svc.toLowerCase().startsWith(i)); }

  function renderServiceList(svcMap) {
    const el = document.getElementById('serviceList');
    el.innerHTML = '';
    const sorted = Object.entries(svcMap).sort((a,b) => b[1]-a[1]);
    for (const [svc, cnt] of sorted) {
      const infra = isInfra(svc);
      const checked = serviceChecks[svc] !== false;
      const item = document.createElement('label');
      item.className = 'svc-item' + (infra ? ' is-infra' : '');
      item.innerHTML = `<input type="checkbox" ${checked?'checked':''} onchange="onServiceToggle('${svc}',this.checked)">
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${svc}">${svc}</span>
        <span class="svc-badge">${cnt}</span>`;
      el.appendChild(item);
    }
  }

  function onServiceToggle(svc, checked) {
    serviceChecks[svc] = checked;
    render();
  }

  function detectContexts(entries) {
    const map = {};
    for (const e of entries) {
      if (e.context === 'AppAuthGuard' && e.msg.includes('📃Context name:')) {
        const name = e.msg.replace(/.*📃Context name:\s*/,'').trim();
        if (name) map[name] = (map[name] || 0) + 1;
      }
      if (e.context === 'WorkerService') {
        const m = e.msg.match(/^Processing job \S+ of type (.+)$/);
        if (m) map[`⚙ ${m[1]}`] = (map[`⚙ ${m[1]}`] || 0) + 1;
      }
    }
    return map;
  }

  function renderContextList(ctxMap) {
    const el = document.getElementById('contextList');
    el.innerHTML = '';
    if (!Object.keys(ctxMap).length) { el.innerHTML = '<div style="color:var(--muted);font-size:11px">No named flows found</div>'; return; }
    const sorted = Object.entries(ctxMap).sort((a,b) => b[1]-a[1]);
    for (const [ctx, cnt] of sorted) {
      const checked = contextChecks[ctx] !== false;
      const item = document.createElement('label');
      item.className = 'svc-item';
      item.innerHTML = `<input type="checkbox" ${checked?'checked':''} onchange="onCtxToggle('${ctx}',this.checked)">
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px" title="${ctx}">${ctx}</span>
        <span class="svc-badge">${cnt}</span>`;
      el.appendChild(item);
    }
  }

  function onCtxToggle(ctx, checked) { contextChecks[ctx] = checked; render(); }

  function toggleAllCtx(val) {
    for (const k of Object.keys(contextChecks)) contextChecks[k] = val;
    document.querySelectorAll('#contextList input').forEach(cb => cb.checked = val);
    render();
  }

  function detectLogContexts(entries) {
    const map = {};
    for (const e of entries) {
      if (e.context) map[e.context] = (map[e.context] || 0) + 1;
    }
    return map;
  }

  function renderLogContextList(map) {
    const el = document.getElementById('logContextList');
    el.innerHTML = '';
    if (!Object.keys(map).length) { el.innerHTML = '<div style="color:var(--muted);font-size:11px">None</div>'; return; }
    for (const [ctx, cnt] of Object.entries(map).sort((a,b) => b[1]-a[1])) {
      const checked = logContextChecks[ctx] !== false;
      const item = document.createElement('label');
      item.className = 'svc-item';
      item.innerHTML = `<input type="checkbox" ${checked?'checked':''} onchange="onLogCtxToggle('${ctx}',this.checked)">
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px" title="${ctx}">${ctx}</span>
        <span class="svc-badge">${cnt}</span>`;
      el.appendChild(item);
    }
  }

  function onLogCtxToggle(ctx, checked) { logContextChecks[ctx] = checked; render(); }

  function toggleAllLogCtx(val) {
    for (const k of Object.keys(logContextChecks)) logContextChecks[k] = val;
    document.querySelectorAll('#logContextList input').forEach(cb => cb.checked = val);
    render();
  }

  function toggleAll(val) {
    for (const k of Object.keys(serviceChecks)) serviceChecks[k] = val;
    document.querySelectorAll('#serviceList input').forEach(cb => cb.checked = val);
    render();
  }

  function onlyServices() {
    for (const k of Object.keys(serviceChecks)) serviceChecks[k] = !isInfra(k);
    document.querySelectorAll('#serviceList .svc-item').forEach(item => {
      const cb = item.querySelector('input');
      cb.checked = !item.classList.contains('is-infra');
    });
    render();
  }

  let allCollapsed = false;
  function collapseAll() {
    allCollapsed = !allCollapsed;
    document.querySelectorAll('.flow-body').forEach(b => b.classList.toggle('open', !allCollapsed));
    document.querySelectorAll('.chevron').forEach(c => c.classList.toggle('open', !allCollapsed));
    document.getElementById('btnCollapseAll').textContent = allCollapsed ? '⊞ Expand All' : '⊟ Collapse All';
  }

  let logMinTs = 0, logMaxTs = 0, sliderFromTs = 0, sliderToTs = 0;
  let thumbFromPct = 0, thumbToPct = 1;

  function fmtLabel(ts) {
    return new Date(ts).toISOString().replace('T',' ').replace(/\.\d+Z$/,'');
  }

  function initSlider(entries) {
    const times = entries.map(e => e.time?.getTime()).filter(Boolean);
    if (!times.length) { document.getElementById('timeRangeWrap').style.display = 'none'; return; }
    logMinTs = Math.min(...times);
    logMaxTs = Math.max(...times);
    thumbFromPct = 0; thumbToPct = 1;
    sliderFromTs = logMinTs; sliderToTs = logMaxTs;
    document.getElementById('timeRangeWrap').style.display = 'flex';
    updateThumbs();
    initDrag();
  }

  function updateThumbs() {
    const rail = document.getElementById('dualSlider');
    const w = rail.offsetWidth;
    const from = document.getElementById('thumbFrom');
    const to   = document.getElementById('thumbTo');
    const track = document.getElementById('sliderTrack');
    const fp = thumbFromPct * 100, tp = thumbToPct * 100;
    from.style.left = fp + '%';
    to.style.left   = tp + '%';
    track.style.left  = fp + '%';
    track.style.width = (tp - fp) + '%';
    from.style.zIndex = thumbFromPct > 0.98 ? 5 : 4;
    to.style.zIndex   = thumbFromPct > 0.98 ? 4 : 5;
    sliderFromTs = logMinTs + (logMaxTs - logMinTs) * thumbFromPct;
    sliderToTs   = logMinTs + (logMaxTs - logMinTs) * thumbToPct;
    document.getElementById('timeRangeLabel').textContent = fmtLabel(sliderFromTs) + ' → ' + fmtLabel(sliderToTs);
  }

  function initDrag() {
    const rail = document.getElementById('dualSlider');
    let dragging = null;
    function getPct(e) {
      const rect = rail.getBoundingClientRect();
      return Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    }
    function onDown(thumb) {
      return e => { e.preventDefault(); dragging = thumb; thumb.style.cursor = 'grabbing'; };
    }
    document.getElementById('thumbFrom').addEventListener('mousedown', onDown('from'));
    document.getElementById('thumbTo').addEventListener('mousedown', onDown('to'));
    window.addEventListener('mousemove', e => {
      if (!dragging) return;
      const p = getPct(e);
      if (dragging === 'from') thumbFromPct = Math.min(p, thumbToPct);
      else                     thumbToPct   = Math.max(p, thumbFromPct);
      updateThumbs(); render();
    });
    window.addEventListener('mouseup', () => {
      if (dragging) { document.getElementById('thumb'+dragging.charAt(0).toUpperCase()+dragging.slice(1)).style.cursor='grab'; dragging = null; }
    });
    rail.addEventListener('click', e => {
      const p = getPct(e);
      const df = Math.abs(p - thumbFromPct), dt = Math.abs(p - thumbToPct);
      if (df < dt) thumbFromPct = Math.min(p, thumbToPct);
      else         thumbToPct   = Math.max(p, thumbFromPct);
      updateThumbs(); render();
    });
  }

  function resetSlider() {
    thumbFromPct = 0; thumbToPct = 1;
    updateThumbs(); render();
  }

  function setLevelFilter(f) {
    levelFilter = f;
    ['all','error','warn'].forEach(x => document.getElementById('f'+x.charAt(0).toUpperCase()+x.slice(1))?.classList.toggle('active', x===f));
    render();
  }

  function groupFlows(entries) {
    const flows = [];
    const traceFlows = {};
    const currentFlows = {};
    const jobFlows = {};
    const serviceTraceFlows = {};
    const hostTraceFlows = {};

    const markFlow = (flow, e) => {
      flow.entries.push(e);
      if (e.level === 'error') flow.hasError = true;
      if (e.level === 'warn') flow.hasWarn = true;
      if (e.msg.includes('Anonymous Request')) flow.isAnon = true;
      if (e.time) flow.lastTime = e.time;
    };

    for (const e of entries) {
      const hostname = e.hostname || e.obj?.hostname || e.obj?.req?.headers?.host || '_';
      const hostKey  = `${e.service}::${hostname}`;
      const traceId = getTraceId(e);
      const isFlowStart = e.context === 'AppAuthGuard' && e.msg.includes('📃Context name:');
      const jobStartM   = e.context === 'WorkerService' && e.msg.match(/^Processing job (\S+) of type (.+)$/);
      const jobEndM     = e.context === 'WorkerService' && e.msg.match(/^Job (\S+) completed/);

      if (traceId) {
        let flow = traceFlows[traceId];
        if (!flow) {
          flow = {
            name: `🔗 ${traceId.slice(0, 12)}`,
            traceId,
            service: e.service,
            startTime: e.time,
            lastTime: e.time,
            entries: [],
            hasError: false,
            hasWarn: false,
            isAnon: false,
            isWorker: false,
            metadata: {
              requestId: e.requestId || e.correlationId || '',
              correlationId: e.correlationId || e.requestId || '',
              context: e.context || '',
              service: e.service || ''
            }
          };
          traceFlows[traceId] = flow;
          flows.push(flow);
        }

        markFlow(flow, e);
        serviceTraceFlows[e.service] = flow;
        hostTraceFlows[hostKey] = flow;
        continue;
      }

      const tracedTarget = hostTraceFlows[hostKey] || serviceTraceFlows[e.service];
      if (tracedTarget) {
        markFlow(tracedTarget, e);
        continue;
      }

      if (isFlowStart) {
        const name = e.msg.replace(/.*📃Context name:\s*/,'').trim();
        const cf = { name, service: e.service, startTime: e.time, entries: [e], hasError: false, hasWarn: false, isAnon: false, isWorker: false };
        currentFlows[hostKey] = cf;
        flows.push(cf);
      } else if (jobStartM) {
        const jobType = jobStartM[2];
        const jf = { name: `⚙ ${jobType}`, service: e.service, startTime: e.time, entries: [e], hasError: false, hasWarn: false, isAnon: false, isWorker: true };
        jobFlows[hostKey] = jf;
        flows.push(jf);
      } else if (jobEndM) {
        const jf = jobFlows[hostKey];
        if (jf) { jf.entries.push(e); delete jobFlows[hostKey]; }
      } else {
        const target = jobFlows[hostKey] || currentFlows[hostKey];
        if (target) {
          target.entries.push(e);
          if (e.level === 'error') target.hasError = true;
          if (e.level === 'warn')  target.hasWarn  = true;
          if (e.msg.includes('Anonymous Request')) target.isAnon = true;
        } else {
          flows.push({ name: null, service: e.service, startTime: e.time, entries: [e], hasError: e.level==='error', hasWarn: e.level==='warn', isAnon: false, isWorker: false });
        }
      }
    }
    return flows;
  }

  function fmtTime(ts) {
    if (!ts) return '';
    return ts.toISOString().replace('T',' ').replace(/\.\d+Z$/,'');
  }

  function relTime(ts, base) {
    if (!ts || !base) return '';
    const d = ts - base;
    return d >= 0 ? `+${d}ms` : `${d}ms`;
  }

  function levelClass(l) { return {error:'ll-error',warn:'ll-warn',info:'ll-info',debug:'ll-debug'}[l]||'ll-debug'; }
  function rowClass(l) { return {error:'level-error',warn:'level-warn',debug:'level-debug'}[l]||''; }

  function renderLogRow(e, base) {
    const div = document.createElement('div');
    div.className = 'log-row ' + rowClass(e.level);
    const rel = relTime(e.time, base);

    const isSQL = e.isJson && e.context === 'TypeORM' && e.obj?.query &&
      /\b(SELECT|INSERT|UPDATE|DELETE)\b/i.test(e.obj.query) &&
      !/^(SELECT 1|START TRANSACTION|COMMIT|ROLLBACK)$/i.test(e.obj.query.trim());

    const msgHtml = isSQL ? escHtml('SQL query') : escHtml(e.msg);
    div.innerHTML = `<span class="log-time">${rel||fmtTime(e.time)}</span>
      <span class="log-level ${levelClass(e.level)}">${e.level.toUpperCase()}</span>
      <span class="log-svc" title="${e.service}">${e.service}</span>
      <span class="log-ctx" title="${e.context}">${e.context}</span>
      ${e.sourceFile ? `<span class="log-src" title="${escHtml(e.sourceFile)}">${escHtml(e.sourceFile)}</span>` : ''}
      <span class="log-msg">${msgHtml}</span>`;

    if (isSQL) {
      const interpolated = injectParams(e.obj.query, e.obj.parameters || []);
      const formatted = beautifySQL(interpolated);
      const sqlBlock = document.createElement('div');
      sqlBlock.className = 'sql-block';
      sqlBlock.style.width = '100%';
      const btn = document.createElement('button');
      btn.className = 'sql-copy';
      btn.textContent = '📋 Copy';
      btn.onclick = ev => { ev.stopPropagation(); copyText(formatted); };
      const pre = document.createElement('pre');
      pre.innerHTML = highlightSQL(formatted);
      sqlBlock.appendChild(btn);
      sqlBlock.appendChild(pre);
      div.appendChild(sqlBlock);
    }
    return div;
  }

  async function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(text);
      else { const el = Object.assign(document.createElement('textarea'),{value:text}); document.body.appendChild(el); el.select(); document.execCommand('copy'); el.remove(); }
      alert('✅ Copied!');
    } catch(e) { alert('⚠️ ' + e.message); }
  }

  function render() {
    const filtered = allEntries.filter(e => serviceChecks[e.service] !== false);
    const levelFiltered = filtered.filter(e => {
      if (levelFilter === 'error') return e.level === 'error';
      if (levelFilter === 'warn') return e.level === 'error' || e.level === 'warn';
      return true;
    });

    const jobEntries = allEntries.filter(e =>
      e.context === 'WorkerService' &&
      (e.msg.match(/^Processing job \S+ of type .+$/) || e.msg.match(/^Job \S+ completed/))
    );
    const mergedForGrouping = [...new Map([...jobEntries, ...levelFiltered].map(e => [e.raw, e])).values()]
      .sort((a, b) => (a.time?.getTime() || 0) - (b.time?.getTime() || 0));

    const fromTs = logMinTs < logMaxTs ? sliderFromTs : null;
    const toTs   = logMinTs < logMaxTs ? sliderToTs   : null;

    const flows = groupFlows(mergedForGrouping);
    const jobFlowCount = flows.filter(f => f.isWorker).length;
    const namedFlows = flows.filter(f => {
      if (!f.name || contextChecks[f.name] === false) return false;
      if (fromTs && f.startTime && f.startTime.getTime() < fromTs) return false;
      if (toTs   && f.startTime && f.startTime.getTime() > toTs)   return false;
      return true;
    });
    const ungrouped = flows.filter(f => !f.name).flatMap(f => f.entries);

    let errCount = 0, warnCount = 0;
    filtered.forEach(e => { if(e.level==='error') errCount++; else if(e.level==='warn') warnCount++; });

    document.getElementById('stats').innerHTML = `
      <span class="stat stat-flow">${namedFlows.length} flows</span>
      ${jobFlowCount ? `<span class="stat" style="background:#fdf6ee;color:#92400e;border:1px solid #d6b896">⚙ ${jobFlowCount} jobs</span>` : ''}
      ${errCount ? `<span class="stat stat-error">🔴 ${errCount} errors</span>` : ''}
      ${warnCount ? `<span class="stat stat-warn">🟡 ${warnCount} warnings</span>` : ''}`;

    const out = document.getElementById('output');
    out.innerHTML = '';

    if (!filtered.length) { out.innerHTML = '<div class="empty">No entries match current filters</div>'; return; }

    for (const flow of namedFlows) {
      const block = document.createElement('div');
      block.className = 'flow-block' + (flow.hasError?' has-error':flow.hasWarn?' has-warn':flow.isWorker?' is-worker':flow.isAnon?' is-anon':'');

      const services = [...new Set(flow.entries.map(e=>e.service))];
      const header = document.createElement('div');
      header.className = 'flow-header';
      header.innerHTML = `<span class="chevron open">▶</span>
        <span class="flow-title">
          <span>${escHtml(flow.name)}</span>
          ${flow.traceId ? `<span class="flow-trace">${escHtml(flow.traceId)}</span>` : ''}
        </span>
        <span class="flow-meta">${fmtTime(flow.startTime)} • ${flow.entries.length} logs</span>
        <div class="flow-badges">
          ${flow.hasError?'<span class="badge badge-error">ERROR</span>':''}
          ${flow.hasWarn?'<span class="badge badge-warn">WARN</span>':''}
          ${flow.isAnon?'<span class="badge" style="background:#f3f4f6;color:#6b7280;border:1px solid #d1d5db">🕵️ Anon</span>':''}
          ${services.map(s=>`<span class="badge badge-svc">${s}</span>`).join('')}
        </div>`;

      const body = document.createElement('div');
      body.className = 'flow-body open';
      if (flow.traceId && flow.metadata) {
        const meta = document.createElement('div');
        meta.style.cssText = 'padding:8px 12px;background:#fafafa;border-bottom:1px solid #e5e7eb;font-size:11px';
        meta.innerHTML = `<b>requestId:</b> ${escHtml(flow.metadata.requestId || '')}&nbsp;&nbsp;<b>service:</b> ${escHtml(flow.metadata.service || '')}&nbsp;&nbsp;<b>context:</b> ${escHtml(flow.metadata.context || '')}`;
        body.appendChild(meta);
      }
      const base = flow.startTime;
      for (const e of flow.entries) {
        if (e.context && logContextChecks[e.context] === false) continue;
        body.appendChild(renderLogRow(e, base));
      }

      header.onclick = () => { const ch = header.querySelector('.chevron'); body.classList.toggle('open'); ch.classList.toggle('open'); };
      block.appendChild(header);
      block.appendChild(body);
      out.appendChild(block);
    }

    if (ungrouped.length) {
      const block = document.createElement('div');
      block.className = 'ungrouped-block';
      const hdr = document.createElement('div');
      hdr.className = 'ungrouped-header';
      hdr.innerHTML = `<span class="chevron">▶</span> Other logs (${ungrouped.length})`;
      const body = document.createElement('div');
      body.className = 'flow-body';
      for (const e of ungrouped) body.appendChild(renderLogRow(e, null));
      hdr.onclick = () => { const ch = hdr.querySelector('.chevron'); body.classList.toggle('open'); ch.classList.toggle('open'); };
      block.appendChild(hdr);
      block.appendChild(body);
      out.appendChild(block);
    }
  }

  function onFileImport(input) {
    const files = [...input.files];
    if (!files.length) return;
    document.getElementById('fileName').textContent = files.length === 1
      ? files[0].name + ' (' + (files[0].size / 1024).toFixed(1) + ' KB)'
      : `${files.length} files`;
    document.getElementById('clearFileBtn').style.display = '';
    Promise.all(files.map(file => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => resolve(`@@SOURCE_FILE@@ ${file.name}
${e.target.result}`);
      reader.onerror = () => reject(reader.error);
      reader.readAsText(file);
    }))).then(chunks => {
      document.getElementById('input').value = chunks.join('\n');
      document.getElementById('input').dispatchEvent(new Event('input'));
    }).catch(err => {
      alert('⚠️ ' + err.message);
    });
  }

  function clearFile() {
    document.getElementById('fileInput').value = '';
    document.getElementById('fileName').textContent = '';
    document.getElementById('clearFileBtn').style.display = 'none';
    document.getElementById('input').value = '';
    document.getElementById('input').dispatchEvent(new Event('input'));
  }

  document.getElementById('input').addEventListener('input', function() {
    allEntries = parseEntries(this.value);
    initSlider(allEntries);
    const svcMap = detectServices(allEntries);
    for (const s of Object.keys(svcMap)) { if (serviceChecks[s] === undefined) serviceChecks[s] = !isInfra(s); }
    for (const s of Object.keys(serviceChecks)) { if (!svcMap[s]) delete serviceChecks[s]; }
    renderServiceList(svcMap);
    const ctxMap = detectContexts(allEntries);
    for (const c of Object.keys(ctxMap)) { if (contextChecks[c] === undefined) contextChecks[c] = true; }
    for (const c of Object.keys(contextChecks)) { if (!ctxMap[c]) delete contextChecks[c]; }
    renderContextList(ctxMap);
    const logCtxMap = detectLogContexts(allEntries);
    for (const c of Object.keys(logCtxMap)) { if (logContextChecks[c] === undefined) logContextChecks[c] = true; }
    for (const c of Object.keys(logContextChecks)) { if (!logCtxMap[c]) delete logContextChecks[c]; }
    renderLogContextList(logCtxMap);
    render();
  });

  setInterval(async () => {
  try {
    console.log("polling...");

    const txt = await fetch("http://localhost:9999/logs")
      .then(r => r.text());

    console.log("received", txt.length);

    if (txt !== lastContent) {
      console.log("log changed");

      lastContent = txt;

      document.getElementById("input").value = txt;

      allEntries = parseEntries(txt);

      const svcMap = detectServices(allEntries);
      renderServiceList(svcMap);

      const ctxMap = detectContexts(allEntries);
      renderContextList(ctxMap);

      const logCtxMap = detectLogContexts(allEntries);
      renderLogContextList(logCtxMap);

      render();
    }
  } catch (e) {
    console.error("poll error", e);
  }
}, 1000);
</script>
</body>
</html>
